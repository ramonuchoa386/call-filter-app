name: Android CI (Testes & Build)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Garantir permissão de execução no Gradle Wrapper
        run: chmod +x gradlew

      - name: Executar Testes Unitários de Domínio (TDD)
        run: ./gradlew test

      - name: Executar Verificação de Build do APK
        run: ./gradlew assembleDebug
